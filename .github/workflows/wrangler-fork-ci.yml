name: Wrangler fork package validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
        with:
          ref: add/wrangler
      - name: Load official Termux package builder
        run: ./scripts/run-docker.sh true
      - name: Free disk space
        run: ./scripts/free-space.sh
      - name: Build Wrangler with official Termux packaging
        run: ./scripts/run-docker.sh -d ./build-package.sh -I -C -a aarch64 wrangler
      - name: Inspect package
        run: |
          set -Eeuo pipefail
          deb=$(find output -maxdepth 1 -name 'wrangler_*_aarch64.deb' -print -quit)
          test -n "$deb"
          dpkg-deb -f "$deb" Package Version Architecture Depends
          sha256sum "$deb"
          mkdir -p artifact
          cp "$deb" artifact/
      - uses: actions/upload-artifact@v6
        with:
          name: wrangler-termux-deb
          path: artifact/*.deb
          if-no-files-found: error

  native-termux:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      TERMUX_IMAGE: termux/termux-docker@sha256:3aed9c7fbcf9195a9919deaad418da006232864a779fb4f322d68a34887a2e15
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: wrangler-termux-deb
          path: artifact
      - name: Verify native ARM runner and install package
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = aarch64
          docker pull "$TERMUX_IMAGE"
          test "$(docker image inspect --format '{{.Architecture}}' "$TERMUX_IMAGE")" = arm64
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE/artifact:/artifact:ro" \
            "$TERMUX_IMAGE" /entrypoint.sh bash -lc '
              set -Eeuo pipefail
              export CI=1 WRANGLER_SEND_METRICS=false
              pkg update -y
              deb=$(find /artifact -name "wrangler_*_aarch64.deb" -print -quit)
              apt install -y --no-install-recommends curl "$deb"
              test "$(node -p "process.platform + \":\" + process.arch")" = "android:arm64"
              test "$(wrangler --version)" = "4.123.0"
              test "$(wrangler2 --version)" = "4.123.0"
              test "$("$PREFIX/lib/wrangler/native/esbuild" --version)" = "0.28.1"
              "$PREFIX/lib/wrangler/native/workerd" --version 2>&1 | grep -F workerd

              smoke="$HOME/wrangler-official-termux-smoke"
              rm -rf "$smoke" && mkdir -p "$smoke" && cd "$smoke"
              cat > index.js <<"JS"
          export default { fetch() { return new Response("official-termux-wrangler-ok"); } };
          JS
              cat > wrangler.jsonc <<"JSON"
          {"name":"official-termux-wrangler-smoke","main":"index.js","compatibility_date":"2026-08-01"}
          JSON
              wrangler deploy --dry-run --outdir "$smoke/dry-run"
              wrangler dev --ip 127.0.0.1 --port 8791 >"$smoke/dev.log" 2>&1 &
              pid=$!
              trap "kill $pid 2>/dev/null || true; wait $pid 2>/dev/null || true" EXIT
              body=""
              for _ in $(seq 1 120); do
                kill -0 "$pid" 2>/dev/null || { cat "$smoke/dev.log"; exit 1; }
                if body=$(curl -fsS --max-time 3 http://127.0.0.1:8791/ 2>/dev/null); then break; fi
                sleep 1
              done
              test "$body" = "official-termux-wrangler-ok"
              printf "Native official-Termux Wrangler smoke: %s\n" "$body"
            '
